name: 🚀 CYBER Telegram Spammer

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: 'Target Chat/User ID'
        required: true
      message:
        description: 'Message to spam'
        required: true
      count:
        description: 'Number of messages'
        default: '50'
      delay:
        description: 'Delay between messages (seconds)'
        default: '1'

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

jobs:
  spam-attack:
    runs-on: ubuntu-latest
    steps:
      - name: 🎯 Start Attack
        run: |
          for i in $(seq 1 ${{ github.event.inputs.count }}); do
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=${{ github.event.inputs.target_id }}" \
              -d "text=${{ github.event.inputs.message }} | CYBER [$i/${{ github.event.inputs.count }}]"
            
            echo "✅ Sent $i/${{ github.event.inputs.count }}"
            sleep ${{ github.event.inputs.delay }}
          done
